
name: Publier le site de Patricia sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FOXY-Patricia-60-ans/package-lock.json

      - name: Installer les dependances
        working-directory: FOXY-Patricia-60-ans
        run: npm ci

      - name: Construire le site
        working-directory: FOXY-Patricia-60-ans
        run: npm run build

      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: FOXY-Patricia-60-ans/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4

